# Scans every PR and every push to main for committed secrets (API keys, tokens,
# private keys) with gitleaks. Not a required check: a red X here means stop, revoke
# the key (it's already public), make a new one, and remove it from the branch.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # lets gitleaks comment on the PR line with the finding

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so every commit in the PR is scanned
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
