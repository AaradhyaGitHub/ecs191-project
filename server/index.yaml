# Datastore composite indexes. Deployed with: gcloud app deploy app.yaml index.yaml
indexes:
  # One exercise's history for a user, newest first.
  - kind: SetEntry
    ancestor: yes
    properties:
      - name: exercise_id
      - name: started_at
        direction: desc

  # This user's workouts, newest first (GET /workouts).
  - kind: Workout
    ancestor: yes
    properties:
      - name: started_at
        direction: desc
